plugins {
    id 'com.android.application'
}

// CI sets KURDMAN_DEBUG_KEYSTORE to a cached debug keystore so every build
// is signed with the same key and installs over the previous version
// (keeping the saved token and the downloaded offline model). Local builds
// leave it unset and fall back to AGP's default debug key.
def kurdmanDebugKeystore = System.getenv('KURDMAN_DEBUG_KEYSTORE')

android {
    namespace 'com.kurdman.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kurdman.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.6.0'
        ndk {
            // Most modern phones are arm64; this keeps the ML Kit APK small
            // enough to send through Telegram and GitHub artifacts easily.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (kurdmanDebugKeystore) {
            ciDebug {
                storeFile file(kurdmanDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (kurdmanDebugKeystore) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            // Compress the large ML Kit/ONNX Runtime libraries in the APK.
            // Android extracts them at install time, so on-device behavior is
            // unchanged while the downloadable APK stays under Telegram's
            // 50 MB bot-upload limit.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8 merged the old jdk7/jdk8 stdlib split artifacts into
// kotlin-stdlib. Some AndroidX/ML Kit transitive dependencies still request
// the 1.6.x split artifacts, which duplicate classes from kotlin-stdlib
// 1.8.22 and fail :app:checkDebugDuplicateClasses. Keep only the merged
// stdlib; the JDK7/JDK8 classes are already included there.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Bundled on-device OCR models: Latin, Korean, Japanese and Chinese.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // Runtime for the downloadable NLLB-200 offline translation model.
    // The 1.34 GB model itself is intentionally not bundled in the APK.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
}
