plugins {
    id 'com.android.application'
}

// Official Koorix releases restore the owner-authorized permanent v2 signer.
// No CI cache or automatic key generation is used for production signing.
// Personal/local debug signing remains independent.
def kurdmanDebugKeystore = System.getenv('KURDMAN_DEBUG_KEYSTORE')
def koorixReleaseKeystore = System.getenv('KOORIX_RELEASE_KEYSTORE')
if (project.findProperty('koorixPreview')?.toString() == 'true') {
    throw new GradleException('The separate Preview build is discontinued; build regular Koorix.')
}

android {
    namespace 'com.kurdman.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kurdman.app'
        minSdk 26
        targetSdk 35
        versionCode 28 // KurdMan 1.8.3: edition flavours (personal build unchanged)
        versionName '1.8.3'
        manifestPlaceholders = [applicationLabel: "@string/app_name"]
        buildConfigField "boolean", "PREVIEW_BUILD", "false"
        ndk {
            // Most modern phones are arm64; this keeps the ML Kit APK small
            // enough to send through Telegram and GitHub artifacts easily.
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (kurdmanDebugKeystore) {
            ciDebug {
                storeFile file(kurdmanDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (koorixReleaseKeystore) {
            koorixRelease {
                storeFile file(koorixReleaseKeystore)
                storeType 'PKCS12'
                storePassword System.getenv('KOORIX_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('KOORIX_RELEASE_ALIAS')
                keyPassword System.getenv('KOORIX_RELEASE_KEY_PASSWORD')
            }
        }
    }

    // Two editions share one codebase:
    //  - kurdman: the developer's personal build (Telegram tools,
    //    optional Unlimited-OCR server mode, no account, no limits).
    //  - koorix: the public/commercial build for other people — no
    //    Telegram section, no Baidu/Unlimited-OCR, account sign-in
    //    (email/Google via Supabase), a small free daily allowance and
    //    Premium unlocked with activation codes.
    flavorDimensions "edition"
    productFlavors {
        kurdman {
            dimension "edition"
            buildConfigField "boolean", "PUBLIC_EDITION", "false"
            buildConfigField "boolean", "SHOW_TELEGRAM", "true"
            buildConfigField "boolean", "SHOW_UNLIMITED_OCR", "true"
            buildConfigField "boolean", "REQUIRE_ACCOUNT", "false"
            buildConfigField "int", "FREE_DAILY_JOBS", "0"
            buildConfigField "int", "FREE_DAILY_PAGES", "0"
            buildConfigField "String", "SUPABASE_URL", '""'
            buildConfigField "String", "SUPABASE_KEY", '""'
        }
        koorix {
            dimension "edition"
            applicationId "com.koorix.app"
            manifestPlaceholders = [applicationLabel: "Koorix"]
            versionCode 11
            // Double quotes on purpose: the KurdMan release job greps the
            // first single-quoted versionName in this file.
            versionName "1.4.1"
            // Release signing is flavour-scoped: never signs the personal edition.
            if (koorixReleaseKeystore) {
                signingConfig signingConfigs.koorixRelease
            }
            buildConfigField "boolean", "PUBLIC_EDITION", "true"
            buildConfigField "boolean", "SHOW_TELEGRAM", "false"
            buildConfigField "boolean", "SHOW_UNLIMITED_OCR", "false"
            buildConfigField "boolean", "REQUIRE_ACCOUNT", "true"
            // Display mirror of the server-side limits in Supabase
            // (koorix_consume_job); the server value is authoritative.
            buildConfigField "int", "FREE_DAILY_JOBS", "3"
            buildConfigField "int", "FREE_DAILY_PAGES", "60"
            buildConfigField "String", "SUPABASE_URL",
                    '"https://cbkddsztcivllpwzflkx.supabase.co"'
            // Publishable (public) key; all data access is protected by
            // Row Level Security + SECURITY DEFINER RPCs server-side.
            buildConfigField "String", "SUPABASE_KEY",
                    '"sb_publishable_vVtVNjubYllxuSnfyzcolA_qk034IwO"'
        }
    }

    buildTypes {
        debug {
            if (kurdmanDebugKeystore) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            // Compress the large ML Kit/ONNX Runtime libraries in the APK.
            // Android extracts them at install time, so on-device behavior is
            // unchanged while the downloadable APK stays under Telegram's
            // 50 MB bot-upload limit.
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8 merged the old jdk7/jdk8 stdlib split artifacts into
// kotlin-stdlib. Some AndroidX/ML Kit transitive dependencies still request
// the 1.6.x split artifacts, which duplicate classes from kotlin-stdlib
// 1.8.22 and fail :app:checkDebugDuplicateClasses. Keep only the merged
// stdlib; the JDK7/JDK8 classes are already included there.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    def isUnitTestConfiguration = name.toLowerCase(java.util.Locale.ROOT).contains('unittest')
    resolutionStrategy {
        if (!isUnitTestConfiguration) {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
    }
}

dependencies {
    // Test-only; no added runtime library, model, permission or APK download.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Bundled on-device OCR models: Latin, Korean, Japanese and Chinese.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // Lightweight offline translation language packs (~30 MB per
    // language), replacing the removed 1.34 GB NLLB-200 download.
    implementation 'com.google.mlkit:translate:17.0.3'
    // ONNX Runtime, used by the optional PP-OCR accurate-OCR pack.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
    // Koorix public edition only: Google Sign-In (ID token is exchanged
    // for a Supabase session). Not present in the personal KurdMan APK.
    koorixImplementation 'com.google.android.gms:play-services-auth:21.3.0'
}
