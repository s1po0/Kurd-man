plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kurdman.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kurdman.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
        ndk {
            // Most modern phones are arm64; this keeps the ML Kit APK small
            // enough to send through Telegram and GitHub artifacts easily.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8 merged the old jdk7/jdk8 stdlib split artifacts into
// kotlin-stdlib. Some AndroidX/ML Kit transitive dependencies still request
// the 1.6.x split artifacts, which duplicate classes from kotlin-stdlib
// 1.8.22 and fail :app:checkDebugDuplicateClasses. Keep only the merged
// stdlib; the JDK7/JDK8 classes are already included there.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Bundled on-device OCR models (Latin for English, plus Korean raws).
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.0'
}
