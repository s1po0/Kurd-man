plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kurdman.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kurdman.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            // Most modern phones are arm64; this keeps the ML Kit APK small
            // enough to send through Telegram and GitHub artifacts easily.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Bundled on-device OCR models (Latin for English, plus Korean raws).
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.0'
}
