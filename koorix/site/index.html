<meta charset="utf-8">

<style>

  .langs button.on{background:linear-gradient(135deg,var(--violet),var(--violet2));border-color:transparent}
  .hero{text-align:center;padding:56px 10px 30px}
  .hero h1{font-size:clamp(28px,5vw,46px);line-height:1.25;margin:0 0 14px}
  .hero h1 span{background:linear-gradient(90deg,var(--violet2),#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}

  .hero .migration{font-size:14px;line-height:1.8;margin:22px auto 0;padding:14px 18px;border:1px solid #68426d;border-radius:14px;background:#21152e;color:#ead0ef}
  .cta{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;text-decoration:none;padding:14px 26px;border-radius:14px;font-weight:800;font-size:16px}
  .btn.main{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 10px 30px rgba(124,58,237,.5)}
  .btn.ghost{border:1px solid #3b2a7a;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:44px 0}
  .card{background:var(--card);border:1px solid #2a1d5c;border-radius:18px;padding:22px}
  .card h3{margin:0 0 8px;font-size:19px}
  .card p{margin:0;color:var(--muted);line-height:1.8;font-size:15px}
  .price{background:linear-gradient(160deg,#1d1440,#120c2b);border:1px solid #3b2a7a;border-radius:22px;padding:28px;text-align:center}

  .plan{background:#221947;border:1px solid #3b2a7a;border-radius:14px;padding:14px 18px;font-weight:800}
  footer{color:var(--muted);text-align:center;padding:34px 0 20px;font-size:14px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <footer>

</div>

const $=id=>document.getElementById(id);
function apply(l){
  const t=T[l]; if(!t) return;
  document.documentElement.lang=l; document.documentElement.dir=t.dir;
  $('t-h1').innerHTML=t.h1; $('t-sub').textContent=t.sub;
  $('t-download').textContent=t.download; $('t-privacy').textContent=t.privacy;
  $('t-migration').textContent=t.migration;
  $('t-features').innerHTML=t.feats.map(f=>`<div class="card"><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join('');
  $('t-premium-h').textContent=t.premHead; $('t-premium').textContent=t.prem;
  $('t-plans').innerHTML=t.plans.map(p=>`<div class="plan">${p}</div>`).join('');
  $('t-foot').textContent=t.foot;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  localStorage.setItem('koorix_site_lang',l);
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.l)));
apply(localStorage.getItem('koorix_site_lang')||'ckb');

</html>
