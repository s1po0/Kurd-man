# Telegram test-message sender.
#
# WHY: the Arena sandbox cannot reach api.telegram.org directly, but a
# GitHub Actions runner can. The agent triggers this workflow (via push /
# workflow_dispatch) and the runner sends the message — proving control.
#
# SETUP (once, by the repo owner — never paste the token in chat/code):
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     TELEGRAM_BOT_TOKEN = <token from @BotFather>
#     TELEGRAM_ADMIN_ID  = <your numeric ID from @userinfobot>
#   Then open your bot in Telegram and press START (/start) — Telegram
#   forbids bots from messaging a user who has not started them first.
#
# NOTE: this is for one-off test/admin messages only. A 24/7 bot still
# needs a real host (PC / Render / Railway / VPS) running `npm run bot`.
name: Telegram Bot Test

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Optional custom message text"
        required: false
        default: ""
  push:
    branches: ["arena/121d982b-kurd-man"]
    paths:
      - ".github/workflows/telegram-bot.yml"

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token and send test message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
          CUSTOM: ${{ inputs.message }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ADMIN" ]; then
            echo "::warning::Secrets not set yet. Add TELEGRAM_BOT_TOKEN and TELEGRAM_ADMIN_ID in Settings > Secrets and variables > Actions, then re-run."
            exit 0
          fi
          echo "Checking bot identity (getMe)..."
          ME=$(curl -s "https://api.telegram.org/bot${TOKEN}/getMe")
          echo "$ME" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d; print('Bot OK: @'+d['result']['username'])"
          TEXT="${CUSTOM:-✅ سڵاو! ئەمە نامەی تاقیکردنەوەیە — Arena Agent کۆنترۆڵی ئەم بۆتەی هەیە 🤖

          Hello! Test message — your Arena agent controls this bot.}"
          echo "Sending message to admin..."
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN}" \
            --data-urlencode "text=${TEXT}")
          echo "$RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('ok'):
              r=d['result']; print(f\"SENT OK: message_id={r['message_id']} chat={r['chat']['id']}\")
          else:
              print('FAILED:', d.get('description')); 
              if 'initiate' in str(d.get('description','')) or d.get('error_code')==403:
                  print('HINT: Open the bot in Telegram and press START (/start) first, then re-run.')
              sys.exit(1)
          "
