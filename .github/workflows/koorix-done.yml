name: Koorix owner completion notice
on:
  push:
    branches: ["arena/**"]
    paths:
      - "koorix/releases/v1.8.2.json"
      - ".github/workflows/koorix-done.yml"
permissions:
  contents: read
jobs:
  notify:
    if: contains(github.event.head_commit.message, '[notify-koorix-done]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require verified actual APK delivery and installed-app evidence
        run: |
          python3 - <<'PY'
          import json
          record=json.load(open('koorix/releases/v1.8.2.json'))
          assert record['version']=='1.8.2' and record['versionCode']==18
          assert record['applicationId']=='com.koorix.app' and record['signingIdentity']=='permanent-v2'
          for feature in ('userLoginRemoved','premiumRemoved','dailyAppQuotasRemoved',
                          'unifiedAppCapableInputChooser','actualContourInkValidation','completeDialogueNoClip',
                          'nativeReadingStudioUi','greenBrandRemoved','softBlueVioletPeachTriad',
                          'persistentHeaderDarkLightShortcut','coveredOcrLinesNormalized',
                          'coveredFragmentsRetainCompleteSourceRows','contextualSoraniSystemFields'):
              assert record['features'][feature] is True, feature
          assert record['features']['separateGalleryAndUnfilteredFiles'] is False
          assert record['features']['newTranslationModel'] is False
          verified=record['independentLocalVerification']
          for check in ('native_triad_dark_mode_checked','native_reading_studio_ui_checked',
                        'native_contour_classes_checked','native_ocr_system_fields_checked',
                        'no_login_gate_checked','free_edition_checked'):
              assert verified[check] is True, check
          assert verified['sha256']==record['apkSha256']
          ci=record['ci']
          assert ci['status']=='success' and ci['failures']==ci['skipped']==0
          assert ci['androidJvmExecutions']>=226 and ci['nativeNarrationExecutions']>=18
          assert ci['nativeGlyphExecutions']>=34 and ci['nativeUiExecutions']>=38
          assert ci['uiCaptures']>=54 and ci['bubbleFixtures']>=20
          qa=record['nativeQaSkill']
          assert qa['repository']=='alirezarezvani/claude-skills' and qa['license']=='MIT'
          assert qa['upstreamInstallersExecuted'] is False
          emulator=record['installedApkEmulator']
          assert emulator['status']=='passed' and emulator['api']==34
          assert emulator['apkSha256']==record['apkSha256']
          assert emulator['readerDataUsed'] is False and emulator['alternateAppOrDebugVariant'] is False
          assert emulator['sourceBlocks']==emulator['targetBlocks'] and emulator['sourceBlocks']>0
          assert record['delivery']['chatFilePresented'] is True
          assert record['delivery']['telegramApkAcknowledged'] is True
          assert record['limitations']['actualSuppliedPageOcrRerun'] is False
          assert record['limitations']['physicalDeviceAcceptance'] is False
          PY
      - name: Tell the owner the verified regular Koorix work is complete
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          test -n "$TOKEN" && test -n "$ADMIN"
          MESSAGE="تەواو بووم ✅
          Koorix 1.8.2 — چاکسازی دووبارەبوونەوەی هێڵ و پاراستنی هەموو وشەکانی OCR؛ زاراوەی Aspect لە پانێڵی سیستەمی گونجاودا دەبێتە تایبەتمەندی.
          ڕێنمایی Java Review / Design QAی Skillە داواکراوەکان بەکار هات. خودی APKی ئاسایی لە ئەمولەیتەری ئەندرۆیددا بە وێنەی نموونە و OCR/وەرگێڕان/ڕەندەری ڕاستەقینە تاقی کراوەتەوە؛ نەک پەڕە تایبەتییەکەت یان هەموو مۆبایلێک. مۆدێلی نوێ نییە.
          APK لە چات و Telegram نێردرا. Dark mode و سێ ڕەنگەکە، پڕۆژەکان، یەک هەڵبژێرەر، خۆڕایی و STOP پارێزراون.
          هەمان package و کلیلی v2؛ لەسەر ئەپی پێشوو دایبمەزرێنە و مەیسڕەوە. پەڕە ڕەسەنەکە دووبارە Translate بکە.
          https://github.com/s1po0/Kurd-man/releases/download/koorix-v1.8.2/Koorix-v1.8.2.apk"
          RESPONSE=$(curl -fsS --connect-timeout 20 --max-time 60 \
            --data-urlencode "chat_id=$ADMIN" --data-urlencode "text=$MESSAGE" \
            "https://api.telegram.org/bot${TOKEN}/sendMessage")
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("result",{}).get("message_id") else 1)'
          echo "::notice::Owner completion message acknowledged by Telegram"
