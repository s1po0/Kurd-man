name: Koorix owner completion notice
on:
  push:
    branches: ["arena/**"]
    paths:
      - "koorix/releases/v1.7.0.json"
      - ".github/workflows/koorix-done.yml"
permissions:
  contents: read
jobs:
  notify:
    if: contains(github.event.head_commit.message, '[notify-koorix-done]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require verified actual APK delivery evidence
        run: |
          python3 - <<'PY'
          import json
          record=json.load(open('koorix/releases/v1.7.0.json'))
          assert record['features']['userLoginRemoved'] is True
          assert record['features']['premiumRemoved'] is True
          assert record['features']['dailyAppQuotasRemoved'] is True
          assert record['features']['unifiedAppCapableInputChooser'] is True
          assert record['features']['separateGalleryAndUnfilteredFiles'] is False
          assert record['version']=='1.7.0' and record['versionCode']==15
          assert record['features']['actualContourInkValidation'] is True
          assert record['features']['completeDialogueNoClip'] is True
          assert record['research']['allThreeTopicsIndexed'] is True
          assert record['research']['includeForks'] is True
          assert record['ci']['androidJvmExecutions']>=170
          assert record['ci']['nativeGlyphExecutions']>=34
          assert record['independentLocalVerification']['native_contour_classes_checked'] is True
          assert record['ci']['status']=='success'
          assert record['delivery']['chatFilePresented'] is True
          assert record['delivery']['telegramApkAcknowledged'] is True
          assert record['independentLocalVerification']['no_login_gate_checked'] is True
          assert record['independentLocalVerification']['free_edition_checked'] is True
          PY
      - name: Tell the owner the verified regular Koorix work is complete
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          test -n "$TOKEN" && test -n "$ADMIN"
          MESSAGE="تەواو بووم ✅
          Koorix 1.7.0 — گونجاندنی دەق بە سنووری بالۆن: پیتە لکێنراوەکان، دەور، سێبەر و سووڕان پێش سڕینەوە پشکنین دەکرێن؛ نەک بڕینی وشەکان. ئەگەر هەموو دەقەکە نەگونجێت، ڕەسەن دەمێنێت.
          هەرسێ لیستی GitHub لەگەڵ فۆرکەکان گەڕاون: ٤٩٩ ریپۆ پۆلێن کراون و سەرچاوە پەیوەندیدارەکان بە وردی پشکنراون. ١٧٠ پشکنین تێپەڕین؛ نموونەی دروستکراون، نەک دڵنیایی هەموو پەڕە و مۆبایلێک.
          APKی ئاسایی لە چات و Telegram نێردرا؛ خۆڕایی و یەک هەڵبژێرەر و هەمان کلیلی v2 پارێزراون. لەسەر ئەپی پێشوو دایبمەزرێنە و مەیسڕەوە.
          https://github.com/s1po0/Kurd-man/releases/download/koorix-v1.7.0/Koorix-v1.7.0.apk"

          RESPONSE=$(curl -fsS --connect-timeout 20 --max-time 60 \
            --data-urlencode "chat_id=$ADMIN" --data-urlencode "text=$MESSAGE" \
            "https://api.telegram.org/bot${TOKEN}/sendMessage")
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("result",{}).get("message_id") else 1)'
          echo "::notice::Owner completion message acknowledged by Telegram"
