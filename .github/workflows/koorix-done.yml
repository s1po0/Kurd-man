name: Koorix owner completion notice
on:
  push:
    branches: ["arena/**"]
    paths:
      - "koorix/releases/v1.8.3.json"
      - ".github/workflows/koorix-done.yml"
permissions:
  contents: read
jobs:
  notify:
    if: contains(github.event.head_commit.message, '[notify-koorix-done]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require verified actual APK delivery and installed-app evidence
        run: |
          python3 - <<'PY'
          import json
          record=json.load(open('koorix/releases/v1.8.3.json'))
          assert record['version']=='1.8.3' and record['versionCode']==19
          assert record['applicationId']=='com.koorix.app' and record['signingIdentity']=='permanent-v2'
          assert record['apkSha256']=='ccb851fd8827c6b248088c28c6daad55c24cd1e3c9ecf9730a32897e0bdc8be0'
          verified=record['independentLocalVerification']
          assert verified['sha256']==record['apkSha256'] and verified['signature']['content_digest_verified']
          assert verified['signature']['certificate_sha256']=='fb304de3cd357f35cf679e2a46befac08f3e97feef28b1b9a8af7b0891d40340'
          ci=record['ci']
          assert ci['status']=='success' and ci['failures']==ci['skipped']==0
          assert ci['androidJvmExecutions']>=268 and ci['publicationExecutions']>=20 and ci['completionExecutions']>=22
          device=record['installedApkEmulator']
          assert device['status']=='passed' and device['apkSha256']==record['apkSha256']
          assert device['publicImageRows']==1 and device['publicTxtRows']==0 and device['publicPdfRows']==1
          assert device['readerDataUsed'] is False and device['physicalPhoneOrSamsungGallery'] is False
          assert device['allArtifactsFetchedAndHashVerified'] is True
          for item in ('one_public_gallery_image_no_automatic_txt','studio_export_same_owned_media_row_canonical_folder_no_txt',
                       'requested_real_pdf_preserved_with_one_gallery_image_no_txt','explicit_manual_protection_retains_stop_and_stops_actual_service'):
              assert item in device['checks'], item
          assert record['delivery']['chatFilePresented'] and record['delivery']['telegramApkAcknowledged']
          assert record['delivery']['releaseAssetDigestMatchesChatFile'] and record['delivery']['publicDownloadHead']==302
          assert record['features']['automaticTxtSidecars'] is False and record['features']['previousReaderFilesAutomaticallyDeleted'] is False
          PY
      - name: Tell the owner the verified regular Koorix work is complete
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          test -n "$TOKEN" && test -n "$ADMIN"
          MESSAGE="تەواو بووم ✅
          Koorix 1.8.3 — هەر وێنەی وەرگێڕدراو یەک کۆپیی گشتی هەیە و TXT خۆکار دروست ناکرێت. دەقی پڕۆژە و فایلە کۆنەکانت پارێزراون.
          پیشاندانی ئەنجام، STOP، Undo و هەناردەی Studio چاک کراون. خودی APKی ئاسایی بە وێنەی نموونە لە ئەمولەیتەردا تاقی کراوەتەوە، نەک لە Galleryی مۆبایلەکەت.
          APK لە چات و Telegram نێردرا. هەمان کلیلی v2؛ لەسەر ئەپی پێشوو دایبمەزرێنە و مەیسڕەوە.
          https://github.com/s1po0/Kurd-man/releases/download/koorix-v1.8.3/Koorix-v1.8.3.apk"
          RESPONSE=$(curl -fsS --connect-timeout 20 --max-time 60 \
            --data-urlencode "chat_id=$ADMIN" --data-urlencode "text=$MESSAGE" \
            "https://api.telegram.org/bot${TOKEN}/sendMessage")
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("result",{}).get("message_id") else 1)'
          echo "::notice::Owner completion message acknowledged by Telegram"
