name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Reuse the same debug signing key on every CI run so new APKs
      # install as updates over the previous version, keeping the app's
      # saved token/settings and the downloaded offline model. Without
      # this, each ephemeral runner generated a fresh debug key and
      # Android forced an uninstall before every update. This caches a
      # DEBUG key only; never use this pattern for release signing.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/kurdman-debug.keystore
          key: kurdman-debug-keystore-v2

      - name: Prepare stable debug keystore
        run: |
          KEYSTORE="$HOME/kurdman-debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::notice::generated a new stable debug keystore (first run)"
          else
            echo "::notice::reusing cached stable debug keystore"
          fi
          echo "KURDMAN_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --stacktrace -p android assembleDebug

      - name: Report APK signer fingerprint
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -n "$KURDMAN_DEBUG_KEYSTORE" ] && [ -f "$KURDMAN_DEBUG_KEYSTORE" ]; then
            echo "::notice::stable debug keystore present at $KURDMAN_DEBUG_KEYSTORE"
          else
            echo "::warning::stable debug keystore missing; update-over-install may not persist"
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$APK" ] && [ -n "$APKSIGNER" ]; then
            DIGEST=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -im1 'SHA-256 digest' | sed 's/.*digest: *//')
            if [ -n "$DIGEST" ]; then
              echo "::notice::APK signer SHA-256=$DIGEST"
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurd-man-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Send APK to Telegram admin
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ADMIN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_ADMIN_ID is missing; skipping Telegram APK send."
            exit 0
          fi
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -z "$APK" ]; then
            echo "::warning::APK not found; skipping Telegram send."
            exit 0
          fi
          SIZE=$(stat -c%s "$APK")
          echo "::notice::APK=$APK bytes=$SIZE"
          if [ "$SIZE" -gt 49000000 ]; then
            echo "::warning::APK is too large for Telegram bot upload; download it from the Actions artifact instead."
            exit 0
          fi
          RESP=$(curl -s -F chat_id="$ADMIN" -F caption="📱 Kurd-man Android APK (debug) — run ${{ github.run_id }}" -F document=@"$APK" "https://api.telegram.org/bot${TOKEN}/sendDocument")
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "::notice::APK sent to Telegram admin"
          else
            echo "::warning::Telegram APK send did not return ok:true"
          fi

  # The chat-delivery sandbox cannot reach the Azure blob host that
  # serves Actions artifacts, so the APK also travels back as an
  # unreferenced git blob fetched through api.github.com. It is not
  # committed anywhere; only its SHA is printed as a run annotation.
  publish-apk-blob:
    name: Publish APK blob for chat delivery
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kurd-man-debug-apk
          path: apk

      - name: Create git blob from APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found in downloaded artifact"
            exit 1
          fi
          APK_BYTES=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          python3 - "$APK" <<'PY'
          import base64, json, sys
          data = open(sys.argv[1], 'rb').read()
          payload = {'content': base64.b64encode(data).decode(),
                     'encoding': 'base64'}
          open('/tmp/apk-blob.json', 'w').write(json.dumps(payload))
          PY
          BLOB_SHA=$(gh api -X POST "repos/${{ github.repository }}/git/blobs" \
            --input /tmp/apk-blob.json --jq .sha)
          echo "::notice::APK_BLOB_SHA=$BLOB_SHA"
          echo "::notice::APK_FILE_SHA256=$APK_SHA256 bytes=$APK_BYTES"
          {
            echo "APK_BLOB_SHA=$BLOB_SHA"
            echo "APK_FILE_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
          } >> "$GITHUB_STEP_SUMMARY"
