name: Koorix APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified production APK and deliver it (otherwise verify only)"
        type: boolean
        default: false
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/koorix-apk.yml"
      - "tools/comic-skill/**"
      - "tools/bubble-tests/**"
      - "tools/free-edition/**"
      - "tools/signing/*.py"
      - "tools/signing/*.sh"
      - "tools/signing/requirements.txt"
      - "signing/**"

permissions:
  contents: read

concurrency:
  group: koorix-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and publish regular Koorix release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned signing tooling
        run: python3 -m pip install -r tools/signing/requirements.txt --disable-pip-version-check

      - name: Test signing recovery, tamper detection and missing-key refusal
        run: |
          python3 -m unittest discover -s tools/signing -p 'test_*.py' -v
          echo "::notice::18 cryptographic recovery and fail-closed signing tests passed"

      - name: Test comic translation rules and safety contracts
        run: |
          set +e
          bash tools/comic-skill/test.sh > /tmp/comic-tests.log 2>&1
          code=$?
          cat /tmp/comic-tests.log
          if [ $code -ne 0 ]; then
            tail -n 8 /tmp/comic-tests.log | while IFS= read -r line; do echo "::error::$line"; done
          else
            grep -E '^(Comic skill:|In-app skill:)' /tmp/comic-tests.log | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit $code

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Test native bubble glyph containment, free activity, unified chooser, projects and automatic translation
        id: android_tests
        run: |
          set +e
          gradle --no-daemon --no-configuration-cache --stacktrace -p android testKoorixReleaseUnitTest > /tmp/koorix-ui-tests.log 2>&1
          code=$?
          tail -n 65 /tmp/koorix-ui-tests.log
          python3 <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('android/app/build/test-results/testKoorixReleaseUnitTest').glob('TEST-*.xml'))
          total=failed=skipped=native=0
          for file in files:
              root=ET.parse(file).getroot()
              total+=int(root.get('tests',0));failed+=int(root.get('failures',0))+int(root.get('errors',0));skipped+=int(root.get('skipped',0))
              if root.get('name','').endswith('.BubbleContainmentAndroidTest'): native+=int(root.get('tests',0))
              for test in root.findall('testcase'):
                  issue=test.find('failure')
                  if issue is not None:
                      detail=(issue.get('message','') or (issue.text or '').split('\n')[0])[:400]
                      print('::error::In-app skill UI contract failed: '+test.get('name','test')+' '+detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          print(f'::notice::In-app skill Android/JVM tests: {total} run, {failed} failed, {skipped} skipped; not device/semantic proof')
          print(f'::notice::Native glyph-containment regressions: {native} run on SDK26/34; synthetic shapes, not device acceptance')
          if total < 170 or native < 34 or failed or skipped:
              print('::error::In-app skill tests were missing, failed or skipped; production distribution is blocked')
              raise SystemExit(1)
          PYTEST
          reports=$?
          if [ $reports -ne 0 ]; then code=$reports; fi
          if [ $code -ne 0 ]; then
            grep -E 'error:|FAILED|What went wrong|Execution failed|Caused by:' /tmp/koorix-ui-tests.log | head -n 7 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Save allowlisted synthetic native shape fixtures for inspection
        if: always() && steps.android_tests.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/bubble-tests/collect.py --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" --run "${{ github.run_id }}"

      - name: Verify free public edition has no payment, registration or allowance service
        run: |
          python3 tools/free-edition/check.py
          node tools/free-edition/site-test.mjs
          node koorix/site/build.mjs

      # No signing cache, no debug fallback and no production key generation.
      # The owner-authorized v2 key is restored from authenticated durable storage.
      - name: Cold-restore and Java-verify the permanent production signer twice
        env:
          KOORIX_SIGNING_WRAP_KEY: ${{ secrets.KOORIX_SIGNING_WRAP_KEY }}
          TELEGRAM_SIGNING_WRAP: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          umask 077
          python3 tools/signing/store.py restore \
            --store signing/koorix-release-v2.enc.json \
            --manifest signing/koorix-release-v2.json \
            --backup signing/recovery-verification.json \
            --out "$RUNNER_TEMP/koorix-key-a" --github-env "$GITHUB_ENV"
          python3 tools/signing/store.py restore \
            --store signing/koorix-release-v2.enc.json \
            --manifest signing/koorix-release-v2.json \
            --backup signing/recovery-verification.json \
            --out "$RUNNER_TEMP/koorix-key-b"
          cmp "$RUNNER_TEMP/koorix-key-a/koorix-release-v2.p12" "$RUNNER_TEMP/koorix-key-b/koorix-release-v2.p12"
          echo "::notice::Permanent production signing identity cold-restored twice without any cache; independent owner backup verified"

      - name: Build regular Koorix release APK
        run: |
          set +e
          gradle --no-daemon --no-configuration-cache --stacktrace -p android assembleKoorixRelease > /tmp/build.log 2>&1
          code=$?
          tail -n 80 /tmp/build.log
          if [ $code -ne 0 ]; then
            python3 <<'PY'
          import re
          lines = open('/tmp/build.log', errors='replace').read().splitlines()
          selected = [line for line in lines if re.search(r'error:|FAILED|What went wrong|Execution failed|Caused by:', line, re.I)]
          for line in selected[:8]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          PY
          else
            echo "::notice::Regular Koorix release Android compilation passed"
          fi
          exit $code

      # Required before ANY APK leaves the runner. This is normal Koorix, not Preview.
      - name: Verify production signer, package, label, version and non-debuggable flag
        run: |
          set +e
          bash tools/signing/verify-apk.sh > /tmp/koorix-apk-verification.log 2>&1
          code=$?
          cat /tmp/koorix-apk-verification.log
          if [ $code -ne 0 ]; then
            python3 <<'PYCODE'
          from pathlib import Path
          for line in Path('/tmp/koorix-apk-verification.log').read_text(errors='replace').splitlines()[-8:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          PYCODE
          fi
          exit $code

      - name: Independently verify public APK v2 digest, manifest, free-edition classes and harness exclusion
        run: |
          python3 tools/signing/inspect-public-apk.py "$APK_FILE" \
            --version "$KOORIX_VERSION" --code "$KOORIX_CODE" --no-login --free
          echo "::notice::Independent public-only APK signature/content/no-login verification passed"

      # Releases/chat delivery do not depend on the repository artifact quota.
      - name: Publish verified APK blob for chat delivery
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || contains(github.event.head_commit.message, '[release-koorix]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_BYTES=$(stat -c%s "$APK_FILE")
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          python3 - "$APK_FILE" <<'PY'
          import base64, json, sys
          data = open(sys.argv[1], 'rb').read()
          payload = {'content': base64.b64encode(data).decode(), 'encoding': 'base64'}
          open('/tmp/apk-blob.json', 'w').write(json.dumps(payload))
          PY
          BLOB_SHA=$(gh api -X POST "repos/${{ github.repository }}/git/blobs" \
            --input /tmp/apk-blob.json --jq .sha)
          echo "::notice::APK_BLOB_SHA=$BLOB_SHA"
          echo "::notice::APK_FILE_SHA256=$APK_SHA256 bytes=$APK_BYTES"
          {
            echo "APK_BLOB_SHA=$BLOB_SHA"
            echo "APK_FILE_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "SIGNER_SHA256=$EXPECTED_SIGNER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish regular Koorix APK to GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || contains(github.event.head_commit.message, '[release-koorix]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="koorix-v$KOORIX_VERSION"
          cp "$APK_FILE" "Koorix-v$KOORIX_VERSION.apk"
          NOTES="Koorix v$KOORIX_VERSION — regular production update, com.koorix.app, arm64, non-debuggable. Completely FREE for now by the owner's decision: Premium, payments, activation codes, daily job/page quotas and device-registration/entitlement clients have been removed, not just hidden. No login, Google account, email or initial online allowance setup. Corrects the 1.6 split picker: ONE input button opens Android's app-capable GET_CONTENT */* chooser for compatible installed Samsung Gallery, MT Manager, ZArchiver, My Files, cloud/photo/file handlers. No separate Gallery/Files screen, photo-only picker, pinned storage root or MIME whitelist. Apps must be installed and declare compatible content selection; exact OEM lists remain phone-dependent. Existing source validation, 300-page/300-MB import and 1-GB cache safety limits remain; protected Android folders and external provider rate limits are not bypassed. Editable books, legacy projects, backups, frozen settings, STOP, recovery, all 74 target choices and Kurdish/English/Arabic UI are preserved. Same permanent v2 signer: install over v2-signed Koorix without uninstalling or deleting app data. Historical encrypted device/subscriber data is not erased or contacted. No paid API, new model or NLLB. Meaning and real-page/device visual acceptance remain limited/unverified; passing synthetic/JVM tests does not certify every translation, OEM gallery or device."

          # An owner-prepared draft/tag is valid too. Upload verified bytes first,
          # then publish; expose public CLI errors without printing credentials.
          set +e
          (
            set -e
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" "Koorix-v$KOORIX_VERSION.apk" --clobber --repo "${{ github.repository }}"
            else
              gh release create "$TAG" "Koorix-v$KOORIX_VERSION.apk" --repo "${{ github.repository }}" \
                --target "${{ github.sha }}" --title "Koorix v$KOORIX_VERSION" --notes "$NOTES" --draft
            fi
            gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
          ) > /tmp/koorix-publication.log 2>&1
          code=$?
          set -e
          cat /tmp/koorix-publication.log
          if [ "$code" -ne 0 ]; then
            python3 <<'PUBLISH_ERROR'
          from pathlib import Path
          for line in Path('/tmp/koorix-publication.log').read_text(errors='replace').splitlines()[-8:]:
              print('::error::Publication: '+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PUBLISH_ERROR
            exit "$code"
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Koorix-v$KOORIX_VERSION.apk"
          echo "::notice::APK_DOWNLOAD_URL=$URL"
          echo "APK_DOWNLOAD_URL=$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send regular same-key Koorix update to Telegram admin
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || contains(github.event.head_commit.message, '[release-koorix]')
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ADMIN" ]; then
            echo "::error::Telegram delivery is required but its secrets are missing"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_FILE")
          if [ "$SIZE" -gt 49000000 ]; then
            echo "::error::APK exceeds Telegram's upload budget"
            exit 1
          fi
          CAPTION="💜 Koorix v$KOORIX_VERSION — وەشانی ئاسایی، نەک Preview.
          بە تەواوی خۆڕایی بۆ ئێستا: Premium، کۆدی چالاککردن و سنووری ڕۆژانە لابران؛ Loginیش نییە.
          یەک دوگمەی هەڵبژاردن: ئەپە گونجاوە دامەزراوەکان وەک Samsung Gallery، MT Manager، ZArchiver و My Files لە یەک هەڵبژێرەردا، نەک دوو بەش. وێنە یان CBZ/ZIP هەڵبژێرە.
          پڕۆژەکان، Backup، STOP و Skillی خۆکار پارێزراون. هەمان کلیلی v2 ـە؛ لەسەر ئەپی پێشوو دایبمەزرێنە و مەیسڕەوە."

          RESP=$(curl -fsS --connect-timeout 20 --max-time 180 \
            --form-string "chat_id=$ADMIN" --form-string "caption=$CAPTION" \
            --form "document=@$APK_FILE;filename=Koorix-v$KOORIX_VERSION.apk" \
            "https://api.telegram.org/bot${TOKEN}/sendDocument")
          if printf '%s' "$RESP" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("result",{}).get("document") else 1)'; then
            echo "::notice::Regular Koorix APK sent to Telegram admin"
          else
            echo "::error::Telegram did not acknowledge APK delivery"
            exit 1
          fi

      - name: Remove ephemeral plaintext signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/koorix-key-a" "$RUNNER_TEMP/koorix-key-b"
