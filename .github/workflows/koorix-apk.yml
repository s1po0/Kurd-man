name: Koorix APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/koorix-apk.yml"
      - "tools/comic-skill/**"
      - "tools/signing/*.py"
      - "tools/signing/*.sh"
      - "tools/signing/requirements.txt"
      - "signing/**"

permissions:
  contents: read

concurrency:
  group: koorix-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and publish regular Koorix release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned signing tooling
        run: python3 -m pip install -r tools/signing/requirements.txt --disable-pip-version-check

      - name: Test signing recovery, tamper detection and missing-key refusal
        run: |
          python3 -m unittest discover -s tools/signing -p 'test_*.py' -v
          echo "::notice::18 cryptographic recovery and fail-closed signing tests passed"

      - name: Test comic translation rules and safety contracts
        run: |
          set +e
          bash tools/comic-skill/test.sh > /tmp/comic-tests.log 2>&1
          code=$?
          cat /tmp/comic-tests.log
          if [ $code -ne 0 ]; then
            tail -n 8 /tmp/comic-tests.log | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::notice::$(tail -n 1 /tmp/comic-tests.log)"
          fi
          exit $code

      # No signing cache, no debug fallback and no production key generation.
      # The owner-authorized v2 key is restored from authenticated durable storage.
      - name: Cold-restore and Java-verify the permanent production signer twice
        env:
          KOORIX_SIGNING_WRAP_KEY: ${{ secrets.KOORIX_SIGNING_WRAP_KEY }}
          TELEGRAM_SIGNING_WRAP: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          umask 077
          python3 tools/signing/store.py restore \
            --store signing/koorix-release-v2.enc.json \
            --manifest signing/koorix-release-v2.json \
            --backup signing/recovery-verification.json \
            --out "$RUNNER_TEMP/koorix-key-a" --github-env "$GITHUB_ENV"
          python3 tools/signing/store.py restore \
            --store signing/koorix-release-v2.enc.json \
            --manifest signing/koorix-release-v2.json \
            --backup signing/recovery-verification.json \
            --out "$RUNNER_TEMP/koorix-key-b"
          cmp "$RUNNER_TEMP/koorix-key-a/koorix-release-v2.p12" "$RUNNER_TEMP/koorix-key-b/koorix-release-v2.p12"
          echo "::notice::Permanent production signing identity cold-restored twice without any cache; independent owner backup verified"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build regular Koorix release APK
        run: |
          set +e
          gradle --no-daemon --no-configuration-cache --stacktrace -p android assembleKoorixRelease > /tmp/build.log 2>&1
          code=$?
          tail -n 80 /tmp/build.log
          if [ $code -ne 0 ]; then
            python3 <<'PY'
          import re
          lines = open('/tmp/build.log', errors='replace').read().splitlines()
          selected = [line for line in lines if re.search(r'error:|FAILED|What went wrong|Execution failed|Caused by:', line, re.I)]
          for line in selected[:8]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          PY
          else
            echo "::notice::Regular Koorix release Android compilation passed"
          fi
          exit $code

      # Required before ANY APK leaves the runner. This is normal Koorix, not Preview.
      - name: Verify production signer, package, label, version and non-debuggable flag
        run: |
          set +e
          bash tools/signing/verify-apk.sh > /tmp/koorix-apk-verification.log 2>&1
          code=$?
          cat /tmp/koorix-apk-verification.log
          if [ $code -ne 0 ]; then
            python3 <<'PYCODE'
          from pathlib import Path
          for line in Path('/tmp/koorix-apk-verification.log').read_text(errors='replace').splitlines()[-8:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          PYCODE
          fi
          exit $code

      # Releases/chat delivery do not depend on the repository artifact quota.
      - name: Publish verified APK blob for chat delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_BYTES=$(stat -c%s "$APK_FILE")
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          python3 - "$APK_FILE" <<'PY'
          import base64, json, sys
          data = open(sys.argv[1], 'rb').read()
          payload = {'content': base64.b64encode(data).decode(), 'encoding': 'base64'}
          open('/tmp/apk-blob.json', 'w').write(json.dumps(payload))
          PY
          BLOB_SHA=$(gh api -X POST "repos/${{ github.repository }}/git/blobs" \
            --input /tmp/apk-blob.json --jq .sha)
          echo "::notice::APK_BLOB_SHA=$BLOB_SHA"
          echo "::notice::APK_FILE_SHA256=$APK_SHA256 bytes=$APK_BYTES"
          {
            echo "APK_BLOB_SHA=$BLOB_SHA"
            echo "APK_FILE_SHA256=$APK_SHA256"
            echo "APK_BYTES=$APK_BYTES"
            echo "SIGNER_SHA256=$EXPECTED_SIGNER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish regular Koorix APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="koorix-v$KOORIX_VERSION"
          cp "$APK_FILE" "Koorix-v$KOORIX_VERSION.apk"
          NOTES="Koorix v$KOORIX_VERSION — regular production release, com.koorix.app, arm64, non-debuggable. Manga/Manhwa translation skill and editable story glossary included; not a new trained model, and offline Sorani quality remains limited. New permanent v2 signing identity with verified independent recovery backup. ONE-TIME MIGRATION from old-certificate Koorix: export the results you need BEFORE uninstalling the old app. Android cannot update across different signing keys. Uninstalling deletes private projects, settings and downloaded packs; no data migration or deletion is automated. Future v2-signed updates will keep this signing identity and install normally over this version."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "Koorix-v$KOORIX_VERSION.apk" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "Koorix-v$KOORIX_VERSION.apk" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Koorix v$KOORIX_VERSION" --notes "$NOTES"
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Koorix-v$KOORIX_VERSION.apk"
          echo "::notice::APK_DOWNLOAD_URL=$URL"
          echo "APK_DOWNLOAD_URL=$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send regular Koorix APK to Telegram admin with migration warning
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ADMIN" ]; then
            echo "::error::Telegram delivery is required but its secrets are missing"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_FILE")
          if [ "$SIZE" -gt 49000000 ]; then
            echo "::error::APK exceeds Telegram's upload budget"
            exit 1
          fi
          CAPTION="💜 Koorix v$KOORIX_VERSION — وەشانی ئاسایی، نەک Preview.
          کلیلی نوێی جێگیر + دۆخی Manga/Manhwa.
          ئاگاداری یەکجارەکی: پێش سڕینەوەی وەشانی کۆن، دەرئەنجامەکانت دەربهێنە؛ سڕینەوە داتای ناوخۆ و پاکێجەکانیش دەسڕێتەوە. کلیلی نوێ لەسەر وەشانی کۆن دانامەزرێت. نوێکارییەکانی دواتر هەمان کلیل بەکاردەهێنن."
          RESP=$(curl -fsS --connect-timeout 20 --max-time 180 \
            --form-string "chat_id=$ADMIN" --form-string "caption=$CAPTION" \
            --form "document=@$APK_FILE;filename=Koorix-v$KOORIX_VERSION.apk" \
            "https://api.telegram.org/bot${TOKEN}/sendDocument")
          if printf '%s' "$RESP" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("result",{}).get("document") else 1)'; then
            echo "::notice::Regular Koorix APK sent to Telegram admin"
          else
            echo "::error::Telegram did not acknowledge APK delivery"
            exit 1
          fi

      - name: Remove ephemeral plaintext signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/koorix-key-a" "$RUNNER_TEMP/koorix-key-b"
