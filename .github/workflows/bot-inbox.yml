# Bot inbox checker: answers messages/photos queued on Telegram.
#
# A bot only replies while something polls Telegram. This workflow is a
# one-pass poller (bot/bot_inbox.py): peek (stdlib only, seconds) ->
# install OCR only if a photo is waiting -> tiled OCR + QA + translate.
# Processed update IDs persist between runs in a rolling actions/cache,
# so nobody gets the same answer twice. User photos are processed only
# on the ephemeral runner and are NEVER uploaded as artifacts.
#
# TRIGGERS:
#   - schedule (main/default branch only — GitHub rule): auto-check
#     every 10 minutes. NOTE: GitHub may delay cron runs, so real-world
#     replies typically arrive within ~5-20 minutes, not instantly.
#   - push touching this feature (agent-triggered immediate check)
#   - workflow_dispatch (Actions tab, manual immediate check)
# A real always-on host remains the only way to get *instant* replies;
# scheduling is the free no-server compromise.
name: Bot Inbox (answer queued messages)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: ["arena/121d982b-kurd-man", "arena/bd7043fa-kurd-man", "arena/54ac1e0d-kurd-man", "arena/d06c3970-kurd-man", "arena/96d98af4-kurd-man", "arena/02a5900f-kurd-man", "main"]
    paths:
      - "bot/bot_inbox.py"
      - "bot/test_bot_inbox.py"
      - "manhwa/translate_manhwa.py"
      - "manhwa/test_translate_manhwa.py"
      - "manhwa/requirements.txt"
      - "manhwa/glossary.json"
      - ".github/workflows/bot-inbox.yml"

concurrency:
  group: bot-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore bot state (processed updates)
        uses: actions/cache@v4
        with:
          path: bot/state/processed.json
          # v2: v1 state marked one photo processed after a loader crash;
          # starting fresh re-fetches it (Telegram still queues it until
          # an offset past it is sent, which the new state never does).
          key: bot-state-v2-${{ github.run_id }}
          restore-keys: |
            bot-state-v2-

      - name: Peek inbox (fast, no installs)
        id: peek
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python3 bot/bot_inbox.py --peek

      - name: Run offline tests before answering anyone
        if: steps.peek.outputs.has_updates == 'true'
        run: |
          (cd manhwa && python3 -m unittest -v)
          (cd bot && python3 -m unittest -v)

      - name: Restore translation cache
        if: steps.peek.outputs.has_updates == 'true'
        uses: actions/cache@v4
        with:
          path: manhwa/cache.sqlite
          key: manhwa-cache-${{ github.run_id }}
          restore-keys: |
            manhwa-cache-

      - name: Install tiled OCR engine and Sorani font — only for photos
        if: steps.peek.outputs.needs_ocr == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          # A real Arabic-script font is mandatory: the renderer now refuses
          # DejaVu-style fallbacks that made Sorani letters look separated.
          sudo apt-get install -y -qq fonts-noto-core || echo "::warning::fonts-noto-core install failed; Sorani rendering will be refused"
          # Native complex-text shaping (HarfBuzz via Raqm) joins Sorani
          # letters properly; without it the code uses arabic_reshaper.
          # Both must never be applied to the same string (double shaping
          # was the "letter by letter" live bug).
          sudo apt-get install -y -qq libraqm0 || echo "::warning::libraqm0 install failed; falling back to reshaper shaping"
          find /usr/share/fonts \( -name 'NotoNaskhArabic*.ttf' -o -name 'NotoSansArabic*.ttf' -o -name 'NotoKufiArabic*.ttf' \) -print
          tesseract --list-langs
          pip install -q -r manhwa/requirements.txt
          python3 -c "from PIL import features; print('::notice::RAQM available=' + str(bool(features.check('raqm'))))"

      - name: Answer queued messages / translate photos
        if: steps.peek.outputs.has_updates == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python3 bot/bot_inbox.py
